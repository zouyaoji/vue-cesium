packages:
  - packages/*
  - demo
  - docs
  - internal/*
  - '!**/__tests__/**'
allowBuilds:
  '@parcel/watcher': true
  esbuild: true
  unrs-resolver: true
  vue-demi: true
minimumReleaseAgeExclude:
  - vue-cesium@3.2.13-beta.17
onlyBuiltDependencies:
  - '@parcel/watcher'
  - esbuild
  - unrs-resolver
  - vue-demi
